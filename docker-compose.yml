version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_ENV=production
      - AWS_DEFAULT_REGION=us-east-1
      - ENABLE_CLOUDWATCH=false
      - DYNAMODB_TABLE_NAME=SentinelPolicyCache
    networks:
      - sentinel-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

name: Sentinel-Gate AI CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package.json

    - name: Install C++ Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential g++

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx pybind11

    - name: Build C++20 Zero-Copy Pattern Engine
      run: |
        cd cpp_engine
        mkdir build && cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release
        cd ../..

    - name: Run Test Suite
      run: |
        python -m pytest tests/ -v

    - name: Run Benchmarks (Decider 2B ~115ms verification)
      run: |
        python benchmarks/run_benchmarks.py

    - name: Validate Next.js Frontend Build
      run: |
        cd frontend
        npm install
        npm run build
